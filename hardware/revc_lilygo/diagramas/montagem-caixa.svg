<text x="665" y="672" font-size="11" text-anchor="start" class="" font-weight="400">livres</text>
<text x="795" y="560" font-size="15" text-anchor="start" class="" font-weight="700">Caixa interna inicial</text>
<text x="795" y="586" font-size="12" text-anchor="start" class="" font-weight="400">135 × 58 × 48 (C × L × A)</text>
<text x="795" y="607" font-size="12" text-anchor="start" class="" font-weight="400">Ajustar com a célula instalada.</text>
<text x="795" y="628" font-size="12" text-anchor="start" class="" font-weight="400">Isolante preso sob a perfurada.</text>
<text x="795" y="649" font-size="12" text-anchor="start" class="" font-weight="400">Deixar folga também sob a H707.</text>
<text x="795" y="670" font-size="12" text-anchor="start" class="" font-weight="400">UPS externo exige berço próprio.</text>
<text x="795" y="691" font-size="12" text-anchor="start" class="" font-weight="400">145 × 95 × 50 é ponto de partida</text>
<text x="795" y="712" font-size="12" text-anchor="start" class="" font-weight="400">para a versão com módulo.</text>
<text x="110" y="791" font-size="13" text-anchor="start" class="muted" font-weight="400">Travessas e colunas suportam a perfurada. A H707 fica presa à base pelos seus próprios furos.</text>
