<text x="404" y="162" font-size="12" text-anchor="middle" class="" font-weight="700">H707 · 110,54 × 32,89</text>
<text x="827" y="168" font-size="16" text-anchor="start" class="" font-weight="700">Fixação</text>
<text x="827" y="193" font-size="11" text-anchor="start" class="" font-weight="400">• 4 pontos H707 no suporte inferior.</text>
<text x="827" y="216" font-size="11" text-anchor="start" class="" font-weight="400">• 4 colunas fora da H707.</text>
<text x="827" y="239" font-size="11" text-anchor="start" class="" font-weight="400">• 2 travessas isolantes de 2–3 mm.</text>
<text x="827" y="262" font-size="11" text-anchor="start" class="" font-weight="400">• 4 parafusos M2,5 na perfurada.</text>
<text x="827" y="285" font-size="11" text-anchor="start" class="" font-weight="400">• Botões e slots acessíveis pela lateral.</text>
<text x="827" y="308" font-size="11" text-anchor="start" class="" font-weight="400">• Base e caixa prendem os cabos.</text>
<text x="39" y="493" font-size="17" text-anchor="start" class="" font-weight="700">B. Corte transversal por uma travessa</text>
