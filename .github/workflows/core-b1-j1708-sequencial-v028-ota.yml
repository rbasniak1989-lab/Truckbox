name: TruckBox CORE 0.2.8 J1708 sequential NEXIQ-style test candidate
on:
  push:
    branches:
      - feature/revb1-v028-j1708-sequencial
    paths:
      - 'firmware/**'
      - '.github/workflows/core-b1-j1708-sequencial-v028-ota.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-ota:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
      - name: Build ESP32-C6 CORE and run full regressions, ESP-IDF v5.5.2
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32c6
          path: firmware/espidf
          command: bash tools/build_v020.sh core && sh tests/run_all.sh
      - name: Validate OTA role, version, chip, image size and integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          data=Path('firmware/espidf/build-core/truckbox_core.bin').read_bytes()
          assert 512 < len(data) < 0x300000, f'OTA 3MiB partition overflow: {len(data)}'
          assert data[0] == 0xe9
          assert data[3]>>4==3
          assert struct.unpack_from('<H',data,12)[0]==13
          assert struct.unpack_from('<I',data,32)[0]==0xABCD5432
          txt=lambda start,end:data[start:end].split(b'\x00',1)[0].decode('ascii')
          assert txt(48,80)=='0.2.8',txt(48,80)
          assert txt(80,112)=='truckbox_core',txt(80,112)
          assert txt(144,176)=='v5.5.2',txt(144,176)
          print('TruckBox CORE v0.2.8, ESP32-C6, parked-only J1708 sequential test')
          print('Bytes:',len(data),'SHA256:',hashlib.sha256(data).hexdigest())
          PY
      - name: Upload test candidate OTA firmware
        uses: actions/upload-artifact@v4
        with:
          name: TruckBox-CORE-v0.2.8-J1708-SEQUENCIAL-TESTE-ESTACIONADO
          path: firmware/espidf/build-core/truckbox_core.bin
          if-no-files-found: error
          retention-days: 30
