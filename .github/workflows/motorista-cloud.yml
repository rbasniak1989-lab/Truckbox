name: Motorista Cloud GPS
on:
  pull_request:
    paths: ['app/**', 'scripts/check_driver_cloud_apk.py', '.github/workflows/motorista-cloud.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source verification
        run: python3 scripts/check_driver_cloud_apk.py
      - name: JVM, native Compose UI, lint, candidate APK and instrumentation compilation
        run: gradle --no-daemon --max-workers=1 :app:testDebugUnitTest :app:lintDebug :app:assembleCloudTest :app:assembleDebugAndroidTest
      - name: APK verification
        run: python3 scripts/check_driver_cloud_apk.py app/build/outputs/apk/cloudTest/app-cloudTest.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TruckBox-Motorista-v0.6.7-Rotas-CI
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/screenshots/
          retention-days: 14
