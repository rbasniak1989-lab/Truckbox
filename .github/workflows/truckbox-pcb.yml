name: TruckBox PCB CI

on:
  push:
    branches: [hardware-reva-pcb, hardware-revb-j1708-4g]
    paths:
      - 'hardware/reva/**'
      - '.github/workflows/truckbox-pcb.yml'
  workflow_dispatch:

jobs:
  kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare KiCad 10 CLI
        run: |
          docker pull kicad/kicad:10.0.5
          docker run --rm kicad/kicad:10.0.5 kicad-cli version

      - name: Fetch RevB JLC footprints
        if: github.ref_name == 'hardware-revb-j1708-4g'
        run: |
          python3 -m pip install --disable-pip-version-check easyeda2kicad
          rm -rf hardware/reva/revb_jlc.pretty
          easyeda2kicad --footprint --lcsc_id C20617360 C5186957 C2687968 C3033025 C88373 C558418 C14651 C19947701 C6423579 C239506 C22365702 --output hardware/reva/revb_jlc
          find hardware/reva/revb_jlc.pretty -maxdepth 1 -type f -print
          echo '--- C22365702 FOOTPRINT ---'
          cat hardware/reva/revb_jlc.pretty/CONN-TH_8P-P4.20_DLL-5566-8A.kicad_mod

      - name: Generate board
        run: |
          python3 hardware/reva/generate_board.py
          python3 hardware/reva/apply_layout_fixes.py
          python3 hardware/reva/apply_layout_v3.py
          python3 hardware/reva/apply_layout_v4.py
          python3 hardware/reva/apply_layout_v5.py
          sed -i 's/for blk in blocks(text):/for _,_,blk in blocks(text):/' hardware/reva/apply_layout_v6.py
          python3 hardware/reva/apply_layout_v6.py
          python3 hardware/reva/apply_layout_v7.py
          python3 hardware/reva/apply_layout_v8.py
          python3 hardware/reva/apply_layout_v9.py
          python3 hardware/reva/apply_layout_v10.py
          python3 hardware/reva/apply_layout_v11.py
          python3 hardware/reva/apply_layout_v12.py
          python3 hardware/reva/apply_layout_v13.py
          python3 hardware/reva/apply_layout_v14.py
          python3 hardware/reva/apply_layout_current.py
          python3 hardware/reva/apply_layout_bridge_fix.py
          python3 hardware/reva/apply_layout_storage_cs.py
          python3 hardware/reva/apply_layout_sd_cs.py
          python3 hardware/reva/apply_layout_link_power.py
          python3 hardware/reva/apply_layout_acc_base.py
          python3 hardware/reva/apply_layout_acc_raw.py
          python3 hardware/reva/apply_layout_sd_power_ctrl.py
          python3 hardware/reva/apply_layout_wdt_done.py
          python3 hardware/reva/apply_layout_buck_rt.py
          python3 hardware/reva/apply_layout_buck_ss.py
          python3 hardware/reva/apply_layout_buck_en.py
          python3 hardware/reva/apply_layout_buck_fb.py
          python3 hardware/reva/apply_layout_l1_fb_clearance.py
          python3 hardware/reva/apply_layout_buck_analog_escape.py
          python3 hardware/reva/apply_layout_pwrgd_tp.py
          python3 hardware/reva/apply_layout_3v3_core.py
          python3 hardware/reva/apply_layout_3v3_fram.py
          python3 hardware/reva/apply_layout_3v3_can.py
          python3 hardware/reva/apply_layout_3v3_link_gnss.py
          python3 hardware/reva/apply_layout_3v3_misc.py
          python3 hardware/reva/apply_layout_power_cleanup.py
          python3 hardware/reva/apply_layout_core_en.py
          python3 hardware/reva/apply_layout_acc_n.py
          python3 hardware/reva/apply_layout_acc_gnd_stitch.py
          python3 hardware/reva/apply_layout_uart_core_link.py
          python3 hardware/reva/apply_layout_gnss_uart_pps.py
          python3 hardware/reva/apply_layout_usb_service_v2.py
          python3 hardware/reva/apply_layout_usb_service_v3.py
          python3 hardware/reva/apply_layout_usb_service_v4.py
          python3 hardware/reva/apply_layout_usb_service_v5.py
          python3 hardware/reva/apply_layout_usb_service_v6.py
          python3 hardware/reva/apply_layout_usb_protection_cc.py
          python3 hardware/reva/apply_layout_input_protection_final.py
          python3 hardware/reva/apply_layout_usb_diffpair_final.py
          python3 hardware/reva/apply_fabrication_layers.py
          if [ "$GITHUB_REF_NAME" = "hardware-revb-j1708-4g" ]; then
            python3 hardware/reva/apply_revb_j1708.py
            python3 hardware/reva/apply_revb_lte.py
            python3 hardware/reva/apply_revb_lte_power.py
            python3 hardware/reva/apply_revb_lte_uart.py
            python3 hardware/reva/apply_revb_lte_uart_link.py
            python3 hardware/reva/apply_revb_lte_pwrkey.py
            python3 hardware/reva/apply_revb_lte_pwrkey_esd.py
            python3 hardware/reva/apply_revb_lte_sim.py
            python3 hardware/reva/apply_revb_lte_sim_esd.py
            python3 hardware/reva/apply_revb_vehicle_connector.py
            python3 hardware/reva/inspect_revb_lte_power.py
          fi
          test -s hardware/reva/TruckBox_RevA.kicad_pcb

      - name: Run real PCB DRC with filled zones
        run: |
          mkdir -p hardware/reva/build
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work kicad/kicad:10.0.5 \
            kicad-cli pcb drc \
              --refill-zones --save-board \
              --severity-all \
              --output hardware/reva/build/drc.rpt \
              hardware/reva/TruckBox_RevA.kicad_pcb
          python3 - <<'PY'
          from pathlib import Path
          import re, collections
          p=Path('hardware/reva/build/drc.rpt')
          text=p.read_text(errors='ignore')
          total=re.search(r'Found\s+(\d+)\s+DRC violations', text)
          c=collections.Counter(re.findall(r'^\[([^\]]+)\]:', text, re.M))
          geom=sum(v for k,v in c.items() if k not in ('lib_footprint_issues','unconnected_items'))
          unconnected=c.get('unconnected_items',0)
          lines=[
              f"drc_total={total.group(1) if total else 'unknown'}",
              f"geometry_electrical={geom}",
              f"unconnected={unconnected}",
              f"library_warnings={c.get('lib_footprint_issues',0)}",
          ]
          lines += [f"{k}={v}" for k,v in c.most_common()]
          Path('hardware/reva/build/drc_summary.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          blocks=re.split(r'(?=^\[[^\]]+\]:)', text, flags=re.M)
          for block in blocks:
              m=re.match(r'^\[([^\]]+)\]:', block)
              if m and m.group(1) != 'lib_footprint_issues':
                  print('--- DRC DETAIL ---')
                  print('\n'.join(block.strip().splitlines()[:14]))
          if geom or unconnected:
              print(f'Manufacturing DRC gate failed: geometry_electrical={geom}, unconnected={unconnected}')
              raise SystemExit(2)
          PY

      - name: Export fabrication candidate
        run: |
          rm -rf hardware/reva/build/gerbers
          mkdir -p hardware/reva/build/gerbers
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work kicad/kicad:10.0.5 \
            kicad-cli pcb export gerbers --check-zones \
              --layers F.Cu,In1.Cu,In2.Cu,B.Cu,F.Mask,B.Mask,F.SilkS,B.SilkS,Edge.Cuts \
              --output hardware/reva/build/gerbers/ \
              hardware/reva/TruckBox_RevA.kicad_pcb
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work kicad/kicad:10.0.5 \
            kicad-cli pcb export drill \
              --output hardware/reva/build/gerbers/ \
              hardware/reva/TruckBox_RevA.kicad_pcb
          test -s hardware/reva/build/gerbers/TruckBox_RevA-F_Cu.gtl
          test -s hardware/reva/build/gerbers/TruckBox_RevA-GND_PLANE.g1
          test -s hardware/reva/build/gerbers/TruckBox_RevA-POWER_SIGNALS.g2
          test -s hardware/reva/build/gerbers/TruckBox_RevA-B_Cu.gbl
          test -s hardware/reva/build/gerbers/TruckBox_RevA-F_Mask.gts
          test -s hardware/reva/build/gerbers/TruckBox_RevA-B_Mask.gbs
          test -s hardware/reva/build/gerbers/TruckBox_RevA-Edge_Cuts.gm1
          test -s hardware/reva/build/gerbers/TruckBox_RevA.drl
          ! find hardware/reva/build/gerbers -maxdepth 1 -type f \( -name '*Courtyard*' -o -name '*Margin*' \) | grep -q .
          (
            cd hardware/reva/build/gerbers
            zip -q ../TruckBox_RevA_Gerbers_JLC.zip \
              TruckBox_RevA-F_Cu.gtl \
              TruckBox_RevA-GND_PLANE.g1 \
              TruckBox_RevA-POWER_SIGNALS.g2 \
              TruckBox_RevA-B_Cu.gbl \
              TruckBox_RevA-F_Mask.gts \
              TruckBox_RevA-B_Mask.gbs \
              TruckBox_RevA-F_Silkscreen.gto \
              TruckBox_RevA-B_Silkscreen.gbo \
              TruckBox_RevA-Edge_Cuts.gm1 \
              TruckBox_RevA.drl
          )
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work kicad/kicad:10.0.5 \
            kicad-cli pcb export pos \
              --format csv --units mm --side both \
              --output hardware/reva/build/positions.csv \
              hardware/reva/TruckBox_RevA.kicad_pcb
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/work" -w /work kicad/kicad:10.0.5 \
            kicad-cli pcb export svg --check-zones \
              --fit-page-to-board --exclude-drawing-sheet \
              --layers F.Cu,F.Silkscreen,Edge.Cuts \
              --output hardware/reva/build/top.svg \
              hardware/reva/TruckBox_RevA.kicad_pcb
          if [ "$GITHUB_REF_NAME" = "hardware-revb-j1708-4g" ]; then
            python3 hardware/reva/generate_revb_jlc_package.py
          fi

      - name: Upload PCB CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: truckbox-reva-pcb-ci
          path: |
            hardware/reva/TruckBox_RevA.kicad_pcb
            hardware/reva/build/**
            hardware/reva/revb_jlc.pretty/**
          if-no-files-found: error
