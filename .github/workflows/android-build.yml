name: Android CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Apply Multimedia fan sensor patch
        run: python scripts/patch_multimedia_fan.py

      - name: Apply Multimedia compatibility fixes
        run: |
          FILE="multimedia/src/main/java/br/com/truckbox/multimedia/MainActivity.kt"
          sed -i '/import androidx.compose.foundation.layout.weight/d' "$FILE"
          sed -i 's/private fun JSONObject.findValue(keys: Set<String>/private fun JSONObject.findValue(wantedKeys: Set<String>/' "$FILE"
          sed -i 's/val names = keys.map/val names = wantedKeys.map/' "$FILE"
          sed -i 's/v.findValue(keys, depth + 1)/v.findValue(wantedKeys, depth + 1)/g' "$FILE"
          sed -i 's/item.findValue(keys, depth + 1)/item.findValue(wantedKeys, depth + 1)/g' "$FILE"

      - name: Build debug APKs
        run: gradle --no-daemon --stacktrace :app:assembleDebug :multimedia:assembleDebug

      - name: Upload Motorista APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckBox-Motorista-v0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Multimedia APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckBox-Multimedia-v0.3.0-FanExperimental-debug
          path: multimedia/build/outputs/apk/debug/multimedia-debug.apk
          if-no-files-found: error
          retention-days: 30
