name: Multimedia Next Homologação
on:
  pull_request:
    paths: ['multimediaNext/**', 'backend-proposal/**', 'settings.gradle.kts', '.github/workflows/multimedia-next.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
      - name: SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Source secrets
        run: python3 scripts/check_next_secrets.py
      - name: Install pinned proposed backend dependencies
        run: npm ci --prefix backend-proposal/v1 --no-audit --no-fund
      - name: Proposed API, RSA proof and isolated Postgres integration (no production)
        run: npm test --prefix backend-proposal/v1
      - name: Proposed API strict types
        run: npm run typecheck --prefix backend-proposal/v1
      - name: Build isolated APK and run JVM/native UI tests
        run: gradle --no-daemon --max-workers=1 :multimediaNext:assembleHomologDebug :multimediaNext:assembleDemoDebug :multimediaNext:testHomologDebugUnitTest :multimediaNext:assembleHomologDebugAndroidTest :multimediaNext:lintHomologDebug
      - name: APK secrets
        run: python3 scripts/check_next_secrets.py multimediaNext/build/outputs/apk/homolog/debug/multimediaNext-homolog-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TruckBox-Next-homologacao
          path: |
            multimediaNext/build/outputs/apk/
            multimediaNext/build/reports/
            multimediaNext/build/screenshots/
          retention-days: 14
