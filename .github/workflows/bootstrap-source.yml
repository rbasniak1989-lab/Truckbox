name: Import TruckBox v0.6.1 and Build APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/bootstrap-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source package
        shell: bash
        run: |
          set -euo pipefail
          for f in 00 01 02 03 04 05 06 08 09 10 11 12 13; do
            test -f ".bootstrap/source/chunk_${f}.b64"
          done
          for f in 0 1 2 3 4; do
            test -f ".bootstrap/source/fix07_${f}.txt"
          done
          {
            cat .bootstrap/source/chunk_00.b64
            cat .bootstrap/source/chunk_01.b64
            cat .bootstrap/source/chunk_02.b64
            cat .bootstrap/source/chunk_03.b64
            cat .bootstrap/source/chunk_04.b64
            cat .bootstrap/source/chunk_05.b64
            cat .bootstrap/source/chunk_06.b64
            cat .bootstrap/source/fix07_0.txt
            cat .bootstrap/source/fix07_1.txt
            cat .bootstrap/source/fix07_2.txt
            cat .bootstrap/source/fix07_3.txt
            cat .bootstrap/source/fix07_4.txt
            cat .bootstrap/source/chunk_08.b64
            cat .bootstrap/source/chunk_09.b64
            cat .bootstrap/source/chunk_10.b64
            cat .bootstrap/source/chunk_11.b64
            cat .bootstrap/source/chunk_12.b64
            cat .bootstrap/source/chunk_13.b64
          } > /tmp/truckbox-source.b64
          base64 --decode /tmp/truckbox-source.b64 > /tmp/truckbox-source.zip
          echo "8e484614c4cb0350ae5bdeaf79f3fb941bd25db39e803b139713c57a9492e804  /tmp/truckbox-source.zip" | sha256sum --check
          test "$(stat -c%s /tmp/truckbox-source.zip)" -eq 103523
          unzip -t /tmp/truckbox-source.zip
          rm -rf /tmp/truckbox-source
          mkdir -p /tmp/truckbox-source
          unzip -q /tmp/truckbox-source.zip -d /tmp/truckbox-source
          test -f /tmp/truckbox-source/TruckBox_Motorista_v0_6_1/app/build.gradle.kts
          test -f /tmp/truckbox-source/TruckBox_Motorista_v0_6_1/.github/workflows/android-build.yml

      - name: Import clean project into repository
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/truckbox-source/TruckBox_Motorista_v0_6_1/. .
          rm -rf .bootstrap
          rm -rf .github/workflows
          mkdir -p .github/workflows
          git checkout HEAD -- .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: import TruckBox Motorista v0.6.1 source"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckBox-Motorista-v0.6.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
